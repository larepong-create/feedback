<style>
/* Layout: clinic back-office in the feedback app's raspberry — blush ground, white panels, left rail on desktop, bottom tabs on phones.
   Star score is the one loud signal: red→green per score, always printed beside the number. */
:root {
  --bg: #fbf3f6; --surface: #ffffff; --sunk: #fdf7f9; --ink: #2f1522; --muted: #7a5a69; --line: #f1dbe4;
  --accent: #c92f6b; --accent-deep: #9d1f51; --accent-soft: #ffe3ec; --accent-line: #f5b6cb; --accent-ink: #ffffff;
  --r1: #d9473f; --r2: #ec7a3a; --r3: #e8a500; --r4: #5fb35f; --r5: #1f8a55;
  --good: #1f8a55; --good-soft: #dcf2e5; --bad: #c4302b; --bad-soft: #fde2df; --warn: #a86400; --warn-soft: #fff1d1;
  --grid: #f3e6ec;
  --shadow: 0 1px 2px rgba(80, 20, 45, .05), 0 6px 22px rgba(80, 20, 45, .07);
  --f-display: "Bai Jamjuree", "IBM Plex Sans Thai", system-ui, sans-serif;
  --f-body: "IBM Plex Sans Thai", "Sarabun", "Leelawadee UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 16px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1a1015; --surface: #25161e; --sunk: #1f1219; --ink: #f7e8ef; --muted: #c09fae; --line: #3e2531;
  --accent: #f06b9e; --accent-deep: #f7a1c2; --accent-soft: #4a1c31; --accent-line: #7a3150; --accent-ink: #2a0716;
  --r1: #ee6b63; --r2: #f08a4e; --r3: #e9b23c; --r4: #6fc56f; --r5: #49b37c;
  --good: #63c98c; --good-soft: #173323; --bad: #f08378; --bad-soft: #45201c; --warn: #f0b44c; --warn-soft: #3a2c10;
  --grid: #33212a;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #1a1015; --surface: #25161e; --sunk: #1f1219; --ink: #f7e8ef; --muted: #c09fae; --line: #3e2531;
  --accent: #f06b9e; --accent-deep: #f7a1c2; --accent-soft: #4a1c31; --accent-line: #7a3150; --accent-ink: #2a0716;
  --r1: #ee6b63; --r2: #f08a4e; --r3: #e9b23c; --r4: #6fc56f; --r5: #49b37c;
  --good: #63c98c; --good-soft: #173323; --bad: #f08378; --bad-soft: #45201c; --warn: #f0b44c; --warn-soft: #3a2c10;
  --grid: #33212a;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.3); color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--f-body); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; line-height: 1.3; }
h1 { font-size: 1.5rem; } h2 { font-size: 1.1rem; font-weight: 600; } h3 { font-size: .98rem; font-weight: 600; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.muted { color: var(--muted); } .small { font-size: .84rem; } .num { font-variant-numeric: tabular-nums; } .mono { font-family: var(--f-mono); font-size: .86em; }

/* shell */
.shell { display: grid; grid-template-columns: 224px minmax(0, 1fr); min-height: 100%; }
.rail { background: var(--surface); border-right: 1px solid var(--line); padding: 18px 12px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; align-items: center; gap: 11px; padding: 0 6px; }
.mark { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(145deg, #ffc4d6, #f58bb0); display: grid; place-items: center; flex: none; }
.mark svg { width: 84%; height: 84%; }
.brand-t { font-family: var(--f-display); font-weight: 700; font-size: 1rem; line-height: 1.2; color: var(--accent-deep); }
.brand-s { font-size: .76rem; color: var(--muted); line-height: 1.3; }
.nav { display: grid; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border: 1px solid transparent; background: none; border-radius: 12px; cursor: pointer; text-align: left; color: var(--muted); font-weight: 500; position: relative; }
.nav button svg { width: 19px; height: 19px; flex: none; }
.nav button:hover { background: var(--sunk); color: var(--ink); }
.nav button.on { background: var(--accent-soft); color: var(--accent-deep); border-color: var(--accent-line); font-weight: 600; }
.nav .badge { margin-left: auto; background: var(--bad); color: #fff; font-size: .7rem; padding: 0 7px; border-radius: 999px; line-height: 1.7; font-variant-numeric: tabular-nums; }
.me { margin-top: auto; border-top: 1px solid var(--line); padding: 12px 6px 0; display: grid; gap: 8px; font-size: .85rem; }
.main { min-width: 0; padding-block: 24px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1160px; margin: 0 auto; display: grid; gap: 16px; }
.wrap.narrow { max-width: 520px; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.mob-top { display: none; }
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { position: fixed; inset: auto 0 0 0; height: auto; flex-direction: row; padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); padding-left: max(4px, env(safe-area-inset-left, 0px)); padding-right: max(4px, env(safe-area-inset-right, 0px)); border-right: 0; border-top: 1px solid var(--line); z-index: 20; }
  .rail .brand, .rail .me { display: none; }
  .nav { grid-auto-flow: column; grid-auto-columns: 1fr; width: 100%; }
  .nav button { flex-direction: column; gap: 1px; font-size: .7rem; padding: 6px 2px; justify-content: center; text-align: center; }
  .nav .badge { position: absolute; top: 0; left: calc(50% + 6px); margin: 0; }
  .main { padding-block: 0 100px; }
  .mob-top { display: flex; align-items: center; gap: 10px; padding-block: 10px; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 10; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
}
.mob-only { display: none; }
@media (max-width: 860px) { .mob-only { display: flex; } }

/* elements */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; box-shadow: var(--shadow); }
.ptitle { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--accent-line); color: var(--accent-deep); background: var(--surface); padding: 9px 16px; border-radius: 12px; cursor: pointer; font-weight: 600; white-space: nowrap; }
.btn:hover { border-color: var(--accent); background: var(--accent-soft); }
.btn svg { width: 17px; height: 17px; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.dng { color: var(--bad); border-color: var(--bad-soft); }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); }
.btn.sm { padding: 4px 10px; font-size: .84rem; border-radius: 10px; }
.btn.big { padding: 12px 22px; font-size: 1rem; }
.btn:disabled { opacity: .55; cursor: progress; }
label.f { display: grid; gap: 5px; font-size: .86rem; font-weight: 500; min-width: 0; }
.hint { font-size: .8rem; color: var(--muted); font-weight: 400; }
.i { width: 100%; border: 1px solid var(--line); background: var(--sunk); border-radius: 12px; padding: 9px 11px; font-size: .95rem; min-width: 0; }
textarea.i { resize: vertical; min-height: 80px; line-height: 1.6; }
.i:focus { outline: none; border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 3px var(--accent-soft); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: start; }
@media (max-width: 640px) { .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); } }
.stack { display: grid; gap: 14px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.err { color: var(--bad); font-size: .88rem; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: .9rem; cursor: pointer; }
.check input { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--accent); flex: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: .86rem; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-deep); font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 12px; padding: 3px; background: var(--surface); gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: 9px; cursor: pointer; font-size: .86rem; color: var(--muted); font-weight: 500; }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.score { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.score i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: .74rem; font-weight: 600; padding: 0 8px; border-radius: 999px; line-height: 1.75; white-space: nowrap; }
.p-wait { background: var(--warn-soft); color: var(--warn); } .p-done { background: var(--good-soft); color: var(--good); }

/* KPI + charts */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 1000px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .kpis > :last-child { grid-column: 1 / -1; } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 2px; box-shadow: var(--shadow); min-width: 0; text-align: left; }
button.kpi { cursor: pointer; } button.kpi:hover { border-color: var(--accent-line); }
.kpi .l { font-size: .8rem; color: var(--muted); }
.kpi .v { font-family: var(--f-display); font-weight: 700; font-size: 1.85rem; line-height: 1.15; font-variant-numeric: tabular-nums; }
.kpi .v small { font-size: .95rem; color: var(--muted); font-weight: 600; }
.kpi .d { font-size: .77rem; color: var(--muted); }
.kpi.alert .v { color: var(--bad); }
.dgrid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
.c4 { grid-column: span 4; } .c5 { grid-column: span 5; } .c6 { grid-column: span 6; } .c7 { grid-column: span 7; } .c12 { grid-column: span 12; }
@media (max-width: 980px) { .c4, .c5, .c6, .c7 { grid-column: span 12; } }
.trend svg { width: 100%; height: auto; display: block; overflow: visible; }
.dist { display: grid; gap: 7px; }
.dist-r { display: grid; grid-template-columns: 4.2em minmax(0, 1fr) 5em; gap: 10px; align-items: center; font-size: .87rem; cursor: pointer; border-radius: 6px; }
.dist-r:hover { background: var(--sunk); }
.track { height: 14px; background: var(--sunk); border-radius: 0 4px 4px 0; }
.bar { display: block; height: 100%; border-radius: 0 4px 4px 0; min-width: 2px; }
.dist-r .n { text-align: right; font-variant-numeric: tabular-nums; }
.br-r { display: grid; grid-template-columns: 6.5em minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: .88rem; }
.br-r .sc { font-weight: 600; font-variant-numeric: tabular-nums; }
.asp { display: grid; gap: 6px; }
.asp-h, .asp-r { display: grid; grid-template-columns: minmax(0, 1fr) 9em minmax(0, 1fr); align-items: center; }
.asp-h { font-size: .76rem; color: var(--muted); }
.asp-h span:first-child { text-align: right; padding-right: 8px; } .asp-h span:last-child { padding-left: 8px; }
.asp-r { font-size: .85rem; }
.asp-r .lft { display: flex; justify-content: flex-end; align-items: center; gap: 6px; }
.asp-r .rgt { display: flex; align-items: center; gap: 6px; }
.asp-r .lab { text-align: center; padding: 0 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.asp-r .b { height: 14px; }
.asp-r .lft .b { background: var(--bad); border-radius: 4px 0 0 4px; }
.asp-r .rgt .b { background: var(--good); border-radius: 0 4px 4px 0; }
.asp-r .v { font-size: .78rem; font-variant-numeric: tabular-nums; color: var(--muted); min-width: 1.4em; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .8rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 0; border-top: 2px solid; display: inline-block; }
#tip { position: fixed; z-index: 90; pointer-events: none; background: var(--ink); color: var(--bg); font-size: .8rem; padding: 6px 10px; border-radius: 8px; max-width: 260px; line-height: 1.45; }
.empty { padding: 24px 10px; text-align: center; color: var(--muted); font-size: .9rem; }

/* list */
.filters { display: grid; grid-template-columns: minmax(0, 2fr) repeat(4, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 900px) { .filters { grid-template-columns: repeat(2, minmax(0, 1fr)); } .filters .q { grid-column: 1 / -1; } }
.items { display: grid; gap: 8px; }
.item { display: grid; grid-template-columns: 6px minmax(0, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; cursor: pointer; text-align: left; padding: 0; width: 100%; }
.item:hover { border-color: var(--accent-line); box-shadow: var(--shadow); }
.item .body { padding: 10px 14px; display: grid; gap: 3px; min-width: 0; }
.item .top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
.item .top .g { flex: 1; }
.item .tx { font-size: .92rem; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.item .as { font-size: .8rem; color: var(--muted); }
.pager { display: flex; justify-content: center; gap: 8px; align-items: center; font-size: .86rem; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; margin: 0; font-size: .9rem; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; overflow-wrap: anywhere; }
.quote { background: var(--sunk); border-radius: 12px; padding: 12px 14px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.7; }
.fnote { white-space: pre-wrap; font-size: .86rem; background: var(--good-soft); border-radius: 10px; padding: 8px 12px; }

/* misc */
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 12px; z-index: 100; font-size: .9rem; max-width: calc(100% - 32px); }
.toast.bad { background: var(--bad); color: #fff; }
@media (max-width: 860px) { .toast { bottom: calc(86px + env(safe-area-inset-bottom, 0px)); } }
.modal { position: fixed; inset: 0; background: rgba(40, 5, 20, .45); z-index: 80; display: grid; place-items: center; padding: 16px; overflow-y: auto; }
.modal .box { background: var(--surface); border-radius: var(--r); padding: 22px; width: min(480px, 100%); display: grid; gap: 14px; box-shadow: var(--shadow); max-height: calc(100vh - 32px); overflow-y: auto; }
.modal .box.wide { width: min(640px, 100%); }
.banner { background: var(--warn-soft); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; font-size: .86rem; }
.banner b { color: var(--warn); }
.login { min-height: 70vh; display: grid; place-items: center; }
.login .panel { width: min(420px, 100%); display: grid; gap: 16px; }
.tbl { width: 100%; border-collapse: collapse; font-size: .88rem; }
.tbl th, .tbl td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { color: var(--muted); font-weight: 500; font-size: .8rem; }
.scroll { overflow-x: auto; }
.qrs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 12px; }
.qrc { border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 8px; justify-items: center; text-align: center; background: var(--sunk); }
.qrc .qr { background: #fff; padding: 10px; border-radius: 10px; width: 170px; height: 170px; display: grid; place-items: center; }
.qrc .qr img, .qrc .qr canvas { width: 150px !important; height: 150px !important; }
.qrc code { font-family: var(--f-mono); font-size: .74rem; overflow-wrap: anywhere; color: var(--accent-deep); }
.sk i { display: block; height: 14px; border-radius: 6px; background: var(--sunk); margin: 10px 0; }
</style>

        '<div class="row"><button class="btn pri" type="submit">บันทึก</button><button class="btn ghost" type="button" data-close>ยกเลิก</button></div></form>');
      qs('#uF', m).onsubmit = function (e) { e.preventDefault(); busy(qs('[type=submit]', m), authed('saveUser', { username: qs('#uU', m).value, name: qs('#uN', m).value, role: qs('#uR', m).value, branch: qs('#uB', m).value, password: qs('#uP', m).value, active: qs('#uA', m).checked })).then(function () { m.remove(); toast('บันทึกผู้ใช้แล้ว'); viewSettings(el); }); };
    }
  }

  // ---------- auto refresh + boot ----------
  setInterval(function () {
    if (!state.user || document.visibilityState !== 'visible' || document.querySelector('.modal')) return;
    var a = document.activeElement; if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
    if (state.view !== 'settings' && state.view !== 'account') load().catch(function () { });
  }, 90000);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && state.user && state.view !== 'settings') load().catch(function () { }); });
  window.addEventListener('unhandledrejection', function (e) { e.preventDefault(); });
  var saved = store('fb_token');
  if (saved) { state.token = saved; start(); } else viewLogin('');
})();
</script>
